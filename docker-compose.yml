services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    # 安全性：移除埠暴露，僅允許內部網路連接
    # ports:
    #   - "3306:3306"
    volumes:
      - ./data/db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      IS_PRODUCTION: ${IS_PRODUCTION:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8000}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin1234}
      JWT_ACCESS_EXPIRE_MINUTES: ${JWT_ACCESS_EXPIRE_MINUTES:-15}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      UPLOAD_DIR: /app/uploads
      CLIP_DIR: /app/clips
      HIGHLIGHT_DIR: /app/highlights
      THUMBNAIL_DIR: /app/thumbnails
    volumes:
      - ./data/uploads:/app/uploads
      - ./data/clips:/app/clips
      - ./data/highlights:/app/highlights
      - ./data/thumbnails:/app/thumbnails
    depends_on:
      db:
        condition: service_healthy

