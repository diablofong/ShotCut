# Preset：雲端版（app only，外部 DB + S3）
# 使用方式：docker compose -f docker-compose.cloud.yml up
#
# 需要 .env 填入以下變數（複製 .env.cloud.example）：
#   DATABASE_URL        必填（mysql+aiomysql://...）
#   SECRET_KEY          必填（openssl rand -hex 32）
#   S3_ACCESS_KEY_ID    必填（或舊版 R2_ACCESS_KEY_ID）
#   S3_SECRET_ACCESS_KEY 必填（或舊版 R2_SECRET_ACCESS_KEY）
#   S3_BUCKET_NAME      必填（或舊版 R2_BUCKET_NAME）
#   S3_ENDPOINT_URL     必填（或舊版 R2_ENDPOINT_URL）

services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      # S3 設定（新格式）
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
      # 向後相容：舊版 R2_* 由 config.py 自動映射至 S3_*
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME}
      R2_ENDPOINT_URL: ${R2_ENDPOINT_URL}
      IS_PRODUCTION: ${IS_PRODUCTION:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8000}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin1234}
      JWT_ACCESS_EXPIRE_MINUTES: ${JWT_ACCESS_EXPIRE_MINUTES:-15}
      ENABLE_CLIPS: ${ENABLE_CLIPS:-false}
      ENABLE_HIGHLIGHTS: ${ENABLE_HIGHLIGHTS:-false}
      ENABLE_SHARING: ${ENABLE_SHARING:-false}
