site_name: ShotCut
site_description: 籃球比賽影片標記與片段擷取工具
site_url: https://diablofong.github.io/ShotCut/
repo_name: diablofong/ShotCut
repo_url: https://github.com/diablofong/ShotCut
edit_uri: ""

theme:
  name: material
  palette:
    - scheme: default
      primary: orange
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: 切換至深色模式
    - scheme: slate
      primary: orange
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: 切換至淺色模式
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang:
        - zh
        - en
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: zh-TW
          name: 繁體中文
          build: true
          nav_translations:
            Home: 首頁
            Deployment: 部署指南
            Infrastructure Setup: 基礎設施申請 SOP
            Usage Guide: 操作說明
            API Reference: API 參考
            Changelog: 版本紀錄

nav:
  - Home: index.md
  - Deployment: deployment.md
  - Infrastructure Setup: infrastructure-setup-sop.md
  - Usage Guide: usage.md
  - API Reference: api.md
  - Changelog: changelog.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/diablofong/ShotCut
