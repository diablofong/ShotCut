# Preset：自建版（app + MariaDB + MinIO 一鍵啟動）
# 使用方式：docker compose -f docker-compose.selfhosted.yml up -d
#
# 需要 .env 填入以下變數（複製 .env.selfhosted.example）：
#   SECRET_KEY            必填（openssl rand -hex 32）
#   DB_PASSWORD           必填（>= 8 字元）
#   S3_ACCESS_KEY_ID      必填（本地 MinIO 帳號，自訂即可，勿填 R2 金鑰）
#   S3_SECRET_ACCESS_KEY  必填（>= 8 字元，MinIO 要求）
#   S3_BUCKET_NAME        選填（預設 shotcut）
#
# 向後相容：可用 MYSQL_PASSWORD 代替 DB_PASSWORD（舊版 .env 格式）

services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-${MYSQL_ROOT_PASSWORD}}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-shotcut}
      MYSQL_USER: ${MYSQL_USER:-shotcut}
      MYSQL_PASSWORD: ${DB_PASSWORD:-${MYSQL_PASSWORD}}
    volumes:
      - ./data/db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY}
      MINIO_API_CORS_ALLOW_ORIGIN: ${CORS_ORIGINS:-http://localhost:8000}
    command: server /data --console-address ":9001"
    volumes:
      - ./data/minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-shotcut}
    volumes:
      - ./scripts/init-minio.sh:/init-minio.sh:ro
    entrypoint: ["/bin/sh", "/init-minio.sh"]
    restart: "no"

  app:
    build: .
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      DATABASE_URL: mysql+aiomysql://${MYSQL_USER:-shotcut}:${DB_PASSWORD:-${MYSQL_PASSWORD}}@db:3306/${MYSQL_DATABASE:-shotcut}
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_URL: http://localhost:${MINIO_PORT:-9000}
      SECRET_KEY: ${SECRET_KEY}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-shotcut}
      IS_PRODUCTION: ${IS_PRODUCTION:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8000}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin1234}
      JWT_ACCESS_EXPIRE_MINUTES: ${JWT_ACCESS_EXPIRE_MINUTES:-15}
      ENABLE_CLIPS: ${ENABLE_CLIPS:-false}
      ENABLE_HIGHLIGHTS: ${ENABLE_HIGHLIGHTS:-false}
      ENABLE_SHARING: ${ENABLE_SHARING:-false}
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

